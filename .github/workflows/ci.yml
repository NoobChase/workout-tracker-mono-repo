# The repository's CI (specs step 2, decisions 10 and 11).
#
#   pull request  -> check
#   push to main  -> check, then migrate + seed dev, then migrate + seed production
#
# One workflow rather than separate check and migrate files, so a migration can
# `needs:` the checks: nothing reaches a database from a commit whose tests
# failed. Migrations -- and the catalog seed, which mutates the database just
# the same (spec step 2, decision 8) -- reach dev and production from here and
# nowhere else. The seed runs after every migration: it is idempotent, so an
# unchanged catalog writes nothing.
#
# GitHub holds no secrets. The two role ARNs are repository *variables*; every
# credential is read from SSM through those roles, and masked on read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC token for AWS. Never add `environment:` to a job -- it
  # changes the token's `sub` claim and the roles' trust policies stop matching.

env:
  AWS_REGION: us-east-2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # The db integration tests create, migrate and delete their own Neon
      # branch, so all they need is the Neon API key.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read the Neon API key
        run: |
          key="$(aws ssm get-parameter --with-decryption \
            --name /workout-tracker/ci/neon-api-key \
            --query Parameter.Value --output text)"
          echo "::add-mask::$key"
          echo "NEON_API_KEY=$key" >> "$GITHUB_ENV"
      - run: npm test

  migrate-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: migrate-dev, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Migrate and seed dev
        run: |
          url="$(aws ssm get-parameter --with-decryption \
            --name /workout-tracker/dev/database-url-direct \
            --query Parameter.Value --output text)"
          echo "::add-mask::$url"
          DATABASE_URL="$url" npm run migrate -w @workout-tracker/db
          DATABASE_URL="$url" npm run seed -w @workout-tracker/db

  # Automatic on merge while there are no users. Once there are, this job gets
  # a GitHub Environment with a required reviewer -- and the migrate role's
  # trust policy gets the matching `environment:` subject (decision 10).
  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: migrate-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_MIGRATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Migrate and seed production
        run: |
          url="$(aws ssm get-parameter --with-decryption \
            --name /workout-tracker/production/database-url-direct \
            --query Parameter.Value --output text)"
          echo "::add-mask::$url"
          DATABASE_URL="$url" npm run migrate -w @workout-tracker/db
          DATABASE_URL="$url" npm run seed -w @workout-tracker/db
